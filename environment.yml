# Per-problem environment. Create with:
#   mamba env create -f environment.yml
# Update after editing this file with:
#   mamba env update -f environment.yml --prune
name: ps2
channels:
  - conda-forge
dependencies:
  - python=3.12

  # --- Required by the course repo (2155-CP2-2026/requirements.txt) ---
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - pillow

  # --- Surrogate models beyond the linear baseline ---
  - pytorch        # CPU/MPS build; Apple Silicon has no CUDA
  - lightgbm

  # --- Notebook tooling ---
  - jupyterlab
  - ipykernel
  - nbdime         # readable notebook diffs/merges; see README
  - ruff
